<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Blog Library</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div id="navbar"></div>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

    <!-- Profile -->
    <div class="profile">
        <img src="../assets/profile.png" class="profile-img">
        <span class="profile-name">User</span>
    </div>

    <!-- Menu -->
    <ul>
        <li onclick="loadSection('posts')">
            <span class="icon">📝</span>
            <span class="text">Posts</span>
        </li>

        <li onclick="loadSection('create')">
            <span class="icon">➕</span>
            <span class="text">Create</span>
        </li>

        <li onclick="loadSection('comments')">
            <span class="icon">💬</span>
            <span class="text">Comments</span>
        </li>

        <li onclick="loadSection('stats')">
            <span class="icon">📊</span>
            <span class="text">Stats</span>
        </li>

        <li onclick="logout()">
            <span class="icon">🚪</span>
            <span class="text">Logout</span>
        </li>
    </ul>

</aside>

        <!-- Content -->
        <main id="content"></main>

    </div>

    <script src="../js/loadComponents.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/auth.js"></script>

</body>
</html>
