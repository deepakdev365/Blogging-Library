<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Blog Library</title>

    <link rel="stylesheet" href="../css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

    <div id="navbar"></div>

    <div class="dashboard">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

    <!-- Menu -->
    <ul>
        <li class="active" onclick="loadSection('posts')">
            <span class="icon" data-lucide="layout-dashboard"></span>
            <span class="text">My Posts</span>
        </li>

        <li onclick="loadSection('create')">
            <span class="icon" data-lucide="plus-circle"></span>
            <span class="text">Create Blog</span>
        </li>

        <li onclick="loadSection('stats')">
            <span class="icon" data-lucide="bar-chart-3"></span>
            <span class="text">Analytics</span>
        </li>

        <li onclick="loadSection('comments')">
            <span class="icon" data-lucide="message-square"></span>
            <span class="text">Comments</span>
        </li>

        <li onclick="logout()">
            <span class="icon" data-lucide="log-out"></span>
            <span class="text">Logout</span>
        </li>
    </ul>

</aside>

        <!-- Content -->
        <main id="content"></main>

    </div>

    <script src="../js/loadComponents.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>

</body>
</html>
