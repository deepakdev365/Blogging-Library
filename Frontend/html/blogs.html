<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Blog Library</title>

    <link rel="stylesheet" href="../css/blogs.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div id="navbar"></div>

    <section class="blogs-container">
        <h2>Latest Blogs</h2>

        <div id="blog-list" class="blog-grid">
            <!-- Default cards (fallback) -->
            <div class="blog-card">
                <img src="../assets/ram.png">
                <h3>Ram crisis</h3>
            </div>

            <div class="blog-card">
                <img src="../assets/dlss.png">
                <h3>DLSS five</h3>
            </div>

            <div class="blog-card">
                <img src="../assets/bali.png">
                <h3>Vacation in Bali</h3>
            </div>

            <div class="blog-card">
                <img src="../assets/mustang.png">
                <h3>Mustang GT</h3>
            </div>

            <div class="blog-card">
                <img src="../assets/laptop.png">
                <h3>How to repair a laptop?</h3>
            </div>
        </div>
    </section>
<!-- Navbar Load -->
    <script>
        fetch("../components/navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            });
    </script>
    <script src="../js/blogs.js"></script>
    <script src="../js/loadComponents.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
