<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Blog | Blog Library</title>

   <link rel="stylesheet" href="../css/write.css">

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div id="navbar"></div>

    <section class="editor-container">
        <h2>Write Your Blog</h2>

        <div class="blog-form">

    <!-- Title -->
    <input type="text" class="blog-title" placeholder="Enter Blog Title">

    <!-- Thumbnail Upload -->
    <label>Upload Thumbnail</label>
    <input type="file" id="thumbnailInput" accept="image/*">

    <!-- Preview -->
    <img id="thumbnailPreview" style="display:none; width:200px; margin-top:10px; border-radius:10px;">

    <!-- Category -->
    <label>Select Category</label>
    <select id="category">
        <option value="">Select Category</option>
        <option value="technology">Technology</option>
        <option value="lifestyle">Daily-life</option>
        <option value="education">Education</option>
        <option value="travel">Travel</option>
        <option value="travel">News</option>
        <option value="travel">Mountains</option>
        <option value="travel">Mechanical</option>
    </select>

</div>
        <div id="editor" style = "height: 300px;"></div>

        <button class="btn-primary" onclick="submitBlog()">Publish Blog</button>
    </section>

    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
<script src="../js/write.js"></script>
<script src="../js/loadComponents.js"></script>
<script src="../js/auth.js"></script>

</body>

</html>
