    <!-- Google Font (similar clean UI style) -->

</head>

<body>

    <!--  Navbar Component -->
    <div id="navbar"></div>

    <!--  Hero Section -->
    <section class="hero">
    <div class="hero-text">
        <h1>Read. Write. <span>Connect.</span></h1>
        <p>
            Discover amazing blogs, share your ideas, and connect with readers
            around the world in Blog Library.
        </p>
        <button class="btn-primary" onclick="goToCategories()">
    Start Reading
</button>
</div>

    <!--  Correct Image -->
    <img src="assets/land.png" alt="Hero Image" class="hero-image">
</section>

     <section class="slider-section">
    <div class="slider-header">
        <h2>Categories</h2>

   <div class="slider" id="categorySlider"></div>

    <!--  Blog Cards -->
    <section class="blogs">

    <div class="blogs-header">
        <h2>Blogs</h2>
        <button class="view-all" onclick="goToBlogs()">View All</button>
    </div>

    <div class="blog-container" id="latestBlogs"></div>

</section>
<!-- CTA Section -->
<section class="cta">
    <h2>Start your blogging journey today 🚀</h2>
<br>
   <div class="cta-buttons">
    <button class="btn-primary" onclick="handleCreateBlog()">
        Create Blog
    </button>
</div>
</section>

    <!--  Footer -->
    <footer>
        <p>© 2026 Blog Library | All Rights Reserved</p>
    </footer>

    <!--  Load Navbar Script -->
    <script>
        fetch("components/navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            });
    </script>
